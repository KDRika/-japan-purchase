<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'self'" />
<meta name="theme-color" content="#f7fcff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="日本代購" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>日本代購</title>
<style>
:root{--bg:#f4fbff;--card:#fff;--line:#dcecf5;--text:#17324a;--muted:#748a9c;--blue:#4aa6e8;--blue2:#91d2f7;--green:#62c9aa;--pink:#ff9aae;--warn:#f0b45c;--danger:#dc6276;--shadow:0 10px 28px rgba(55,116,154,.09)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#f9fdff,#eff9ff);color:var(--text);-webkit-tap-highlight-color:transparent}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:18px 16px 108px}.hero{background:linear-gradient(145deg,#eaf8ff,#fff);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)}.hero h1{margin:0;font-size:28px}.hero p{margin:6px 0 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;border:1px solid #edf5fa}.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}
.search{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;font-size:15px;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);cursor:pointer}.menu b{display:block;margin-top:8px}.menu span{color:var(--muted);font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section-title h2{font-size:18px;margin:0}.items{display:flex;flex-direction:column;gap:10px}.item{display:grid;grid-template-columns:68px 1fr auto;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;align-items:center;box-shadow:0 4px 12px rgba(64,123,159,.04)}.thumb{width:68px;height:68px;border-radius:14px;object-fit:cover;background:#edf6fb}.item h3{font-size:15px;margin:0 0 4px}.meta{font-size:12px;color:var(--muted);line-height:1.45}.badge{font-size:12px;padding:6px 8px;border-radius:999px;white-space:nowrap}.todo{background:#fff0f3;color:#d45670}.done{background:#eaf9f4;color:#278a70}.found{background:#edf6ff;color:#2d80c7}.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:28px;width:58px;height:58px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:32px;box-shadow:0 12px 24px rgba(61,157,243,.30);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(17,39,57,.28);display:none;align-items:flex-end;justify-content:center;z-index:8}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#f9fdff;border-radius:26px 26px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:15px}.field textarea{min-height:76px}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{border:1px dashed #a9cfe8;background:#fff;border-radius:16px;padding:14px;text-align:center;font-size:13px;color:#5b7890}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions.three{grid-template-columns:1fr 1fr 1fr}.btn{border:none;border-radius:14px;padding:13px;font-size:15px}.secondary{background:#edf6fb;color:#47677e}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}.danger{background:#fff0f2;color:var(--danger)}.toolbar{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.chip{border:none;border-radius:999px;padding:8px 12px;background:#fff;border:1px solid var(--line);white-space:nowrap}.chip.active{background:#dff1ff;color:#1876bd;border-color:#adddff}.empty{padding:32px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.preview img{width:74px;height:74px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.summary{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.person-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid #edf3f7}.person-row:last-child{border-bottom:0}.person-row b{font-size:15px}.person-row small{display:block;color:var(--muted);margin-top:4px}.amount{text-align:right}.amount b{display:block}.amount span{font-size:12px;color:var(--muted)}.backup-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.backup-card h3{margin:0 0 6px;font-size:16px}.backup-card p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 12px}.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}.hidden{display:none!important}
@media (max-width:380px){.grid{grid-template-columns:1fr}.item{grid-template-columns:58px 1fr auto}.thumb{width:58px;height:58px}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <h1>🇯🇵 日本代購</h1><p>把好物買回來，也把帳記清楚。</p>
    <div class="stats"><div class="stat"><b id="pendingCount">0</b><span>待購買</span></div><div class="stat"><b id="doneCount">0</b><span>已購買</span></div><div class="stat"><b id="totalYen">¥0</b><span>總花費</span></div></div>
  </section>
  <input id="search" class="search" placeholder="搜尋商品、委託人…" />
  <div class="grid">
    <div class="menu" data-filter="all">🛍️<b>全部商品</b><span>查看完整清單</span></div>
    <div class="menu" data-filter="person">👤<b>依委託人</b><span>快速看誰還沒買</span></div>
    <div class="menu" data-filter="store">🏪<b>依店家</b><span>藥妝店、百貨、超市…</span></div>
    <div class="menu" data-filter="settlement">💴<b>結算</b><span>每個人花多少日幣</span></div>
    <div class="menu" data-filter="receipt">🧾<b>發票紀錄</b><span>集中查看發票照片</span></div>
    <div class="menu" data-filter="backup">☁️<b>備份資料</b><span>匯出／匯入完整紀錄</span></div>
  </div>
  <div class="section-title"><h2 id="listTitle">代購清單</h2><span id="countLabel" class="meta"></span></div>
  <div class="toolbar" id="statusFilters"><button class="chip active" data-status="all">全部</button><button class="chip" data-status="todo">未買</button><button class="chip" data-status="found">已找到</button><button class="chip" data-status="done">已購買</button></div>
  <div class="items" id="items"></div>
</div>
<button class="fab" id="addBtn">＋</button>
<div class="modal" id="modal"><div class="sheet"><h2 id="formTitle">新增代購</h2><form id="form">
  <input type="hidden" id="editId" />
  <div class="field"><label>商品名稱</label><input id="name" required placeholder="例如：資生堂眼霜" /></div>
  <div class="field"><label>委託人</label><input id="person" required placeholder="例如：媽媽" /></div>
  <div class="field"><label>店家分類</label><select id="store"><option>藥妝店</option><option>百貨／商場</option><option>超市</option><option>服飾店</option><option>伴手禮</option><option>其他</option></select></div>
  <div class="field"><label>數量</label><input id="qty" type="number" min="1" value="1" /></div>
  <div class="field"><label>狀態</label><select id="status"><option value="todo">未買</option><option value="found">已找到</option><option value="done">已購買</option></select></div>
  <div class="field"><label>實際金額（日幣）</label><input id="yen" type="number" min="0" placeholder="例如：5480" /></div>
  <div class="field"><label>備註</label><textarea id="note" placeholder="顏色、尺寸、版本、不要買錯的地方…"></textarea></div>
  <div class="uploads"><label class="upload">📷 商品參考圖<input id="productImages" type="file" accept="image/*" multiple style="display:none"></label><label class="upload">🧾 發票照片<input id="receiptImage" type="file" accept="image/*" capture="environment" style="display:none"></label></div>
  <div class="preview" id="preview"></div>
  <div class="actions" id="normalActions"><button type="button" class="btn secondary" id="cancelBtn">取消</button><button class="btn primary" type="submit">儲存</button></div>
  <div class="actions three hidden" id="editActions"><button type="button" class="btn danger" id="deleteBtn">刪除</button><button type="button" class="btn secondary" id="cancelBtn2">取消</button><button class="btn primary" type="submit">儲存</button></div>
</form></div></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden" />
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const state={status:'all',search:'',mode:'all'};let data=[];
try{data=JSON.parse(localStorage.getItem('jpProxyItems')||'[]')}catch(e){data=[]}
if(!data.length){data=[{id:crypto.randomUUID(),name:'資生堂眼霜',person:'媽媽',store:'藥妝店',qty:2,status:'todo',yen:0,note:'紅色包裝',productImages:[],receipt:null,updatedAt:Date.now()},{id:crypto.randomUUID(),name:'東京香蕉',person:'小美',store:'伴手禮',qty:2,status:'done',yen:2592,note:'',productImages:[],receipt:null,updatedAt:Date.now()}];save()}
function save(){localStorage.setItem('jpProxyItems',JSON.stringify(data))}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function stats(){const done=data.filter(x=>x.status==='done');$('#pendingCount').textContent=data.filter(x=>x.status!=='done').length;$('#doneCount').textContent=done.length;$('#totalYen').textContent=money(done.reduce((s,x)=>s+Number(x.yen||0),0))}
function filtered(){let list=[...data];if(state.status!=='all')list=list.filter(x=>x.status===state.status);if(state.search)list=list.filter(x=>(x.name+x.person+x.store+x.note).toLowerCase().includes(state.search.toLowerCase()));return list}
function render(){stats();const box=$('#items');box.innerHTML='';const special=['settlement','backup'].includes(state.mode);$('#statusFilters').classList.toggle('hidden',special);$('#addBtn').classList.toggle('hidden',state.mode==='backup');
 if(state.mode==='settlement'){renderSettlement(box);return} if(state.mode==='backup'){renderBackup(box);return}
 let list=filtered();$('#listTitle').textContent=state.mode==='receipt'?'發票紀錄':'代購清單';$('#countLabel').textContent=list.length+' 項';if(!list.length){box.innerHTML='<div class="empty">目前沒有符合條件的代購項目</div>';return}
 if(state.mode==='person'||state.mode==='store'){const key=state.mode==='person'?'person':'store';const groups={};list.forEach(x=>(groups[x[key]]??=[]).push(x));Object.entries(groups).sort().forEach(([g,arr])=>{const h=document.createElement('div');h.className='section-title';h.innerHTML=`<h2>${esc(g)}</h2><span class="meta">${arr.length} 項</span>`;box.appendChild(h);arr.forEach(x=>box.appendChild(card(x)))})}
 else if(state.mode==='receipt'){list=list.filter(x=>x.receipt);$('#countLabel').textContent=list.length+' 張';if(!list.length){box.innerHTML='<div class="empty">尚未上傳任何發票</div>';return}list.forEach(x=>box.appendChild(card(x)))}else list.forEach(x=>box.appendChild(card(x)))
}
function card(x){const d=document.createElement('div');d.className='item';const img=x.productImages?.[0]||'';d.innerHTML=`${img?`<img class="thumb" src="${img}">`:`<div class="thumb" style="display:grid;place-items:center;font-size:26px">🛍️</div>`}<div><h3>${esc(x.name)} ×${x.qty}</h3><div class="meta">${esc(x.person)}｜${esc(x.store)}</div><div class="meta">${x.status==='done'?money(x.yen):esc(x.note||'尚未購買')}</div>${x.receipt?'<div class="meta">🧾 已附發票</div>':''}</div><span class="badge ${x.status}">${x.status==='todo'?'未買':x.status==='found'?'已找到':'已購買'}</span>`;d.onclick=()=>openForm(x.id);return d}
function renderSettlement(box){$('#listTitle').textContent='依委託人結算';const done=data.filter(x=>x.status==='done');const map={};done.forEach(x=>{const p=x.person||'未指定';map[p]??={sum:0,count:0};map[p].sum+=Number(x.yen||0);map[p].count++});const entries=Object.entries(map).sort((a,b)=>b[1].sum-a[1].sum);$('#countLabel').textContent=entries.length+' 人';if(!entries.length){box.innerHTML='<div class="empty">還沒有已購買的品項</div>';return}const wrap=document.createElement('div');wrap.className='summary';entries.forEach(([p,v])=>{const r=document.createElement('div');r.className='person-row';r.innerHTML=`<div><b>${esc(p)}</b><small>${v.count} 項已購買</small></div><div class="amount"><b>${money(v.sum)}</b><span>實付日幣</span></div>`;wrap.appendChild(r)});box.appendChild(wrap)}
function renderBackup(box){$('#listTitle').textContent='備份與還原';$('#countLabel').textContent='';box.innerHTML=`<div class="backup-card"><h3>匯出備份</h3><p>把商品、金額、商品照片與發票照片一起存成 JSON 檔。建議旅行中每天備份一次。</p><button class="btn primary" style="width:100%" id="exportBtn">匯出完整備份</button></div><div class="backup-card"><h3>匯入備份</h3><p>換手機或清除瀏覽器資料後，可以用之前匯出的 JSON 檔還原。</p><button class="btn secondary" style="width:100%" id="importBtn">選擇備份檔還原</button><div class="small-note">匯入會取代目前這台裝置上的代購資料。</div></div><div class="backup-card"><h3>iPhone 主畫面</h3><p>發布到 HTTPS 網址後，用 Safari 開啟 → 分享 →「加入主畫面」，就會像 App 一樣獨立開啟。</p></div>`;$('#exportBtn').onclick=exportBackup;$('#importBtn').onclick=()=>$('#importFile').click()}
function openForm(id){$('#modal').style.display='flex';$('#preview').innerHTML='';$('#productImages').value='';$('#receiptImage').value='';const editing=!!id;$('#normalActions').classList.toggle('hidden',editing);$('#editActions').classList.toggle('hidden',!editing);if(id){const x=data.find(i=>i.id===id);$('#formTitle').textContent='編輯代購';$('#editId').value=x.id;$('#name').value=x.name;$('#person').value=x.person;$('#store').value=x.store;$('#qty').value=x.qty;$('#status').value=x.status;$('#yen').value=x.yen||'';$('#note').value=x.note||'';[...(x.productImages||[]),...(x.receipt?[x.receipt]:[])].forEach(src=>{const i=new Image();i.src=src;$('#preview').appendChild(i)})}else{$('#formTitle').textContent='新增代購';$('#form').reset();$('#editId').value='';$('#qty').value=1}}
function closeForm(){$('#modal').style.display='none'}
async function compressImage(file,max=1500,quality=.78){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const scale=Math.min(1,max/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=url})}
$('#form').onsubmit=async e=>{e.preventDefault();const id=$('#editId').value;let x=id?data.find(i=>i.id===id):{id:crypto.randomUUID(),productImages:[],receipt:null};x.name=$('#name').value.trim();x.person=$('#person').value.trim();x.store=$('#store').value;x.qty=Number($('#qty').value||1);x.status=$('#status').value;x.yen=Number($('#yen').value||0);x.note=$('#note').value.trim();x.updatedAt=Date.now();const p=[...$('#productImages').files];if(p.length)x.productImages=await Promise.all(p.slice(0,3).map(f=>compressImage(f)));const r=$('#receiptImage').files[0];if(r)x.receipt=await compressImage(r,1800,.8);if(!id)data.unshift(x);try{save()}catch(err){alert('照片或資料太多，瀏覽器空間不足。請先匯出備份，再刪除部分大型圖片。');return}closeForm();render()}
function deleteCurrent(){const id=$('#editId').value;if(!id)return;if(confirm('確定刪除這筆代購嗎？')){data=data.filter(x=>x.id!==id);save();closeForm();render()}}
function exportBackup(){const payload={app:'日本代購',version:2,exportedAt:new Date().toISOString(),items:data};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='日本代購備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());const items=Array.isArray(parsed)?parsed:parsed.items;if(!Array.isArray(items))throw new Error();if(!confirm(`將以備份中的 ${items.length} 筆資料取代目前資料，確定嗎？`))return;data=items;save();state.mode='all';render();alert('備份已還原。')}catch(err){alert('這不是有效的日本代購備份檔。')}finally{e.target.value=''}}
$('#addBtn').onclick=()=>openForm();$('#cancelBtn').onclick=closeForm;$('#cancelBtn2').onclick=closeForm;$('#deleteBtn').onclick=deleteCurrent;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeForm()};$('#search').oninput=e=>{state.search=e.target.value;render()};$$('#statusFilters .chip').forEach(b=>b.onclick=()=>{$$('#statusFilters .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.status=b.dataset.status;render()});$$('.menu').forEach(m=>m.onclick=()=>{state.mode=m.dataset.filter;render()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body></html>
