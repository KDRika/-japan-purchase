<style>

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#f9fdff,#eff9ff);color:var(--text);-webkit-tap-highlight-color:transparent}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:18px 16px 108px}.hero{background:linear-gradient(145deg,#eaf8ff,#fff);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)}.hero h1{margin:0;font-size:28px}.hero p{margin:6px 0 0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.stat{background:#fff;border-radius:16px;padding:12px 8px;text-align:center;border:1px solid #edf5fa}.stat b{display:block;font-size:19px}.stat span{font-size:12px;color:var(--muted)}
.search{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;font-size:15px;outline:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.menu{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);cursor:pointer}.menu b{display:block;margin-top:8px}.menu span{color:var(--muted);font-size:13px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 10px}.section-title h2{font-size:18px;margin:0}.items{display:flex;flex-direction:column;gap:10px}.item{display:grid;grid-template-columns:68px 1fr auto;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;align-items:center;box-shadow:0 4px 12px rgba(64,123,159,.04)}.thumb{width:68px;height:68px;border-radius:14px;object-fit:cover;background:#edf6fb}.item h3{font-size:15px;margin:0 0 4px}.meta{font-size:12px;color:var(--muted);line-height:1.45}.badge{font-size:12px;padding:6px 8px;border-radius:999px;white-space:nowrap}.todo{background:#fff0f3;color:#d45670}.done{background:#eaf9f4;color:#278a70}.found{background:#edf6ff;color:#2d80c7}.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:28px;width:58px;height:58px;border:none;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:32px;box-shadow:0 12px 24px rgba(61,157,243,.30);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(17,39,57,.28);display:none;align-items:flex-end;justify-content:center;z-index:8}.sheet{width:min(520px,100%);max-height:92vh;overflow:auto;background:#f9fdff;border-radius:26px 26px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.sheet h2{margin:0 0 12px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:15px}.field textarea{min-height:76px}.uploads{display:grid;grid-template-columns:1fr 1fr;gap:10px}.upload{border:1px dashed #a9cfe8;background:#fff;border-radius:16px;padding:14px;text-align:center;font-size:13px;color:#5b7890}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.actions.three{grid-template-columns:1fr 1fr 1fr}.btn{border:none;border-radius:14px;padding:13px;font-size:15px}.secondary{background:#edf6fb;color:#47677e}.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff}.danger{background:#fff0f2;color:var(--danger)}.toolbar{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.chip{border:none;border-radius:999px;padding:8px 12px;background:#fff;border:1px solid var(--line);white-space:nowrap}.chip.active{background:#dff1ff;color:#1876bd;border-color:#adddff}.empty{padding:32px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.preview{display:flex;flex-direction:column;gap:10px;margin-top:10px}.preview-group{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}.preview-title{font-size:12px;color:var(--muted);margin-bottom:8px}.preview-grid{display:flex;gap:8px;flex-wrap:wrap}.preview-wrap{position:relative}.preview img{width:74px;height:74px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}.remove-img{position:absolute;right:-5px;top:-5px;width:22px;height:22px;border:0;border-radius:50%;background:#17324a;color:#fff;font-size:14px;line-height:22px;padding:0}.viewer{position:fixed;inset:0;z-index:30;background:rgba(8,22,32,.94);display:none;flex-direction:column}.viewer.show{display:flex}.viewer-top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 14px 10px;color:#fff}.viewer-btn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;padding:9px 12px;font-size:17px}.viewer-stage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:10px 10px 26px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}.viewer-stage img{display:block;width:100%;height:auto;max-width:none;margin:auto;border-radius:8px}.viewer-controls{display:flex;justify-content:center;gap:10px;padding:10px 14px calc(12px + env(safe-area-inset-bottom))}.viewer-count{font-size:13px;color:#d9e7ef}.image-count{font-size:11px;color:var(--muted);margin-top:3px}
.summary{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px}.person-row{display:flex;align-items:center;justify-content:space-between;padding:13px 2px;border-bottom:1px solid #edf3f7}.person-row:last-child{border-bottom:0}.person-row b{font-size:15px}.person-row small{display:block;color:var(--muted);margin-top:4px}.amount{text-align:right}.amount b{display:block}.amount span{font-size:12px;color:var(--muted)}.backup-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.backup-card h3{margin:0 0 6px;font-size:16px}.backup-card p{font-size:13px;color:var(--muted);line-height:1.5;margin:0 0 12px}.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.small-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}.hidden{display:none!important}

:root{--bg:#f6f9fb;--card:rgba(255,255,255,.94);--line:#e6edf2;--text:#183247;--muted:#7e909d;--blue:#5d9fc8;--blue2:#8fc4df;--shadow:0 8px 24px rgba(35,72,96,.055)}

.search{height:48px;border-radius:17px;margin:16px 0 14px;padding:0 16px;background:rgba(255,255,255,.92);box-shadow:0 5px 18px rgba(35,72,96,.035)}
.grid{gap:11px}.menu{min-height:126px;border-radius:22px;padding:17px 17px 15px;box-shadow:0 7px 22px rgba(35,72,96,.045);transition:transform .15s ease,box-shadow .15s ease}.menu:active{transform:scale(.985);box-shadow:0 3px 12px rgba(35,72,96,.04)}.menu-icon{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#f0f6f9;color:#5b91b2}.menu-icon svg,.upload-icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.menu b{margin-top:13px;font-size:16px;font-weight:700;letter-spacing:.015em}.menu span:last-child{font-size:12px;line-height:1.45;margin-top:4px;display:block}
.section-title{margin-top:23px}.section-title h2{font-size:19px;font-weight:720}.toolbar{gap:7px}.chip{padding:8px 13px;border-color:#e5edf2;color:#607789;background:rgba(255,255,255,.85)}.chip.active{background:#edf6fb;color:#477e9f;border-color:#d2e7f2}
.item{border-radius:20px;padding:11px;border-color:#e7eef3;box-shadow:0 5px 18px rgba(35,72,96,.035)}.thumb{border-radius:15px;background:#f0f5f7}.thumb.placeholder{color:#8aa5b5}.thumb.placeholder svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}.item h3{font-size:15.5px;font-weight:680}.meta{font-size:12px}.image-count{font-size:11px;color:#7890a0}.badge{font-size:11.5px;padding:6px 9px}.todo{background:#fbf0f2;color:#be6978}.found{background:#eef6fa;color:#5a8eaa}.done{background:#edf7f3;color:#4d8d79}
.fab{width:60px;height:60px;background:linear-gradient(145deg,#6aa9cd,#8dc8e3);font-size:0;box-shadow:0 14px 28px rgba(75,140,177,.24)}.fab:before,.fab:after{content:"";position:absolute;left:50%;top:50%;width:22px;height:2px;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}.fab:after{transform:translate(-50%,-50%) rotate(90deg)}
.upload{min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-color:#cbdde7;color:#527487;background:#fff;font-size:13px}.upload small{font-size:11px;color:#91a2ad}.upload-icon{color:#6b9bb7;display:grid;place-items:center}
.sheet{background:#f8fbfc}.field input,.field select,.field textarea{border-color:#e3ebef;box-shadow:0 2px 8px rgba(35,72,96,.025)}.primary{background:linear-gradient(145deg,#659fc2,#8bbfda)}


/* V5 warm beige visual system */

.menu-icon{background:#f6ede5;color:#9c6a49}.menu:nth-child(2) .menu-icon{background:#f5eee8;color:#9a745f}.menu:nth-child(3) .menu-icon{background:#f3ece4;color:#9a6848}.menu:nth-child(4) .menu-icon{background:#f6efe8;color:#aa7956}.menu:nth-child(5) .menu-icon{background:#f5eee8;color:#9b6a4b}.menu:nth-child(6) .menu-icon{background:#f2ece7;color:#886f60}

.primary,.fab{background:linear-gradient(135deg,#9f6b49,#c49a7b);color:#fff}.secondary{background:#f0e7df;color:#6e5849}
.todo{background:#faeeeb;color:#b5625f}.found{background:#f2ece5;color:#916743}.done{background:#edf3ed;color:#627f68}
.sheet{background:#fbf7f2}.upload{color:#8a6d5b;border-color:#cbb09c}.remove-img{background:#4a382e}.viewer-btn{background:rgba(255,255,255,.15)}

<body>
<div class="app">
  <section class="hero">
    <div class="brand-row"><span class="brand-mark" aria-hidden="true"></span><div><h1>日本代購</h1><p>把好物買回來，也把帳記清楚。</p></div></div>
    <div class="stats"><div class="stat"><b id="pendingCount">0</b><span>待購買</span></div><div class="stat"><b id="doneCount">0</b><span>已購買</span></div><div class="stat"><b id="totalYen">¥0</b><span>總花費</span></div></div>
  </section>
  <input id="search" class="search" placeholder="搜尋商品、委託人…" />
  <div class="grid">
    <div class="menu" data-filter="all"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg></span><b>全部商品</b><span>查看完整清單</span></div>
    <div class="menu" data-filter="person"><span class="menu-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 20c.7-4 3-6 6.5-6s5.8 2 6.5 6"/></svg></span><b>依委託人</b><span>快速看誰還沒買</span></div>
    <div class="menu" data-filter="store"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1-4H5L4 9Z"/><path d="M5 9v10h14V9"/><path d="M9 19v-5h6v5"/></svg></span><b>依店家</b><span>藥妝店、百貨、超市…</span></div>
    <div class="menu" data-filter="settlement"><span class="menu-icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><path d="M16 15h2"/></svg></span><b>結算</b><span>每個人花多少日幣</span></div>
    <div class="menu" data-filter="receipt"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M7 3h10v18l-2-1.5L13 21l-2-1.5L9 21l-2-1.5L5 21V5a2 2 0 0 1 2-2Z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><b>發票紀錄</b><span>集中查看發票照片</span></div>
    <div class="menu" data-filter="backup"><span class="menu-icon"><svg viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .7-7.9A6 6 0 0 0 6.4 8.7 4.5 4.5 0 0 0 7 18Z"/><path d="M12 10v6M9.5 12.5 12 10l2.5 2.5"/></svg></span><b>備份資料</b><span>匯出／匯入完整紀錄</span></div>
  </div>
  <div class="section-title"><h2 id="listTitle">代購清單</h2><span id="countLabel" class="meta"></span></div>
  <div class="toolbar" id="statusFilters"><button class="chip active" data-status="all">全部</button><button class="chip" data-status="todo">未買</button><button class="chip" data-status="found">已找到</button><button class="chip" data-status="done">已購買</button></div>
  <div class="items" id="items"></div>
</div>
<button class="fab" id="addBtn">＋</button>
<div class="modal" id="modal"><div class="sheet"><h2 id="formTitle">新增代購</h2><form id="form">
  <input type="hidden" id="editId" />
  <div class="field"><label>商品名稱</label><input id="name" required placeholder="例如：資生堂眼霜" /></div>
  <div class="field"><label>委託人</label><input id="person" required placeholder="例如：媽媽" /></div>
  <div class="field"><label>店家分類</label><select id="store"><option>藥妝店</option><option>百貨／商場</option><option>超市</option><option>服飾店</option><option>伴手禮</option><option>其他</option></select></div>
  <div class="field"><label>數量</label><input id="qty" type="number" min="1" value="1" /></div>
  <div class="field"><label>狀態</label><select id="status"><option value="todo">未買</option><option value="found">已找到</option><option value="done">已購買</option></select></div>
  <div class="field"><label>實際金額（日幣）</label><input id="yen" type="number" min="0" placeholder="例如：5480" /></div>
  <div class="field"><label>備註</label><textarea id="note" placeholder="顏色、尺寸、版本、不要買錯的地方…"></textarea></div>
  <div class="uploads"><label class="upload"><span class="upload-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m5 17 4-4 3 3 2-2 5 5"/></svg></span>商品參考圖<small>可多張</small><input id="productImages" type="file" accept="image/*" multiple style="display:none"></label><label class="upload"><span class="upload-icon"><svg viewBox="0 0 24 24"><path d="M7 3h10v18l-2-1.5L13 21l-2-1.5L9 21l-2-1.5L5 21V5a2 2 0 0 1 2-2Z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>發票照片<small>可多張</small><input id="receiptImages" type="file" accept="image/*" multiple style="display:none"></label></div>
  <div class="preview" id="preview"></div>
  <div class="actions" id="normalActions"><button type="button" class="btn secondary" id="cancelBtn">取消</button><button class="btn primary" type="submit">儲存</button></div>
  <div class="actions three hidden" id="editActions"><button type="button" class="btn danger" id="deleteBtn">刪除</button><button type="button" class="btn secondary" id="cancelBtn2">取消</button><button class="btn primary" type="submit">儲存</button></div>
</form></div></div>
<div class="viewer" id="viewer"><div class="viewer-top"><button class="viewer-btn" id="viewerClose">✕</button><span class="viewer-count" id="viewerCount"></span><button class="viewer-btn" id="viewerReset">重設</button></div><div class="viewer-stage" id="viewerStage"><img id="viewerImage" alt="照片預覽"></div><div class="viewer-controls"><button class="viewer-btn" id="viewerPrev">‹</button><button class="viewer-btn" id="viewerZoomOut">－</button><button class="viewer-btn" id="viewerZoomIn">＋</button><button class="viewer-btn" id="viewerNext">›</button></div></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden" />
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const state={status:'all',search:'',mode:'all'};let data=[];
const DB_NAME='jpProxyDB';const DB_VERSION=1;const STORE='items';let db;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function txDone(tx){return new Promise((resolve,reject)=>{tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('transaction aborted'))})}
async function dbGetAll(){const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).getAll();const rows=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result||[]);req.onerror=()=>rej(req.error)});await txDone(tx);return rows}
async function dbReplaceAll(items){const tx=db.transaction(STORE,'readwrite');const st=tx.objectStore(STORE);st.clear();items.forEach(x=>st.put(x));await txDone(tx)}
async function save(){await dbReplaceAll(data)}
function normalize(items){return (items||[]).map(x=>{const y={...x};if(!Array.isArray(y.productImages))y.productImages=[];if(!Array.isArray(y.receiptImages))y.receiptImages=y.receipt?[y.receipt]:[];delete y.receipt;if(!y.id)y.id=crypto.randomUUID();return y})}
async function initData(){db=await openDB();let rows=normalize(await dbGetAll());if(!rows.length){let legacy=[];try{legacy=normalize(JSON.parse(localStorage.getItem('jpProxyItems')||'[]'))}catch(e){}if(legacy.length){await dbReplaceAll(legacy);rows=legacy;localStorage.setItem('jpProxyMigratedV5','1')}}data=rows.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));render()}
function esc(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return '¥'+Number(n||0).toLocaleString('ja-JP')}
function stats(){const done=data.filter(x=>x.status==='done');$('#pendingCount').textContent=data.filter(x=>x.status!=='done').length;$('#doneCount').textContent=done.length;$('#totalYen').textContent=money(done.reduce((s,x)=>s+Number(x.yen||0),0))}
function filtered(){let list=[...data];if(state.status!=='all')list=list.filter(x=>x.status===state.status);if(state.search)list=list.filter(x=>(x.name+x.person+x.store+x.note).toLowerCase().includes(state.search.toLowerCase()));return list}
function render(){stats();const box=$('#items');box.innerHTML='';const special=['settlement','backup'].includes(state.mode);$('#statusFilters').classList.toggle('hidden',special);$('#addBtn').classList.toggle('hidden',state.mode==='backup');if(state.mode==='settlement'){renderSettlement(box);return}if(state.mode==='backup'){renderBackup(box);return}let list=filtered();$('#listTitle').textContent=state.mode==='receipt'?'發票紀錄':'代購清單';$('#countLabel').textContent=list.length+' 項';if(!list.length){box.innerHTML='<div class="empty">目前沒有符合條件的代購項目</div>';return}if(state.mode==='person'||state.mode==='store'){const key=state.mode==='person'?'person':'store';const groups={};list.forEach(x=>(groups[x[key]]??=[]).push(x));Object.entries(groups).sort().forEach(([g,arr])=>{const h=document.createElement('div');h.className='section-title';h.innerHTML=`<h2>${esc(g)}</h2><span class="meta">${arr.length} 項</span>`;box.appendChild(h);arr.forEach(x=>box.appendChild(card(x)))})}else if(state.mode==='receipt'){list=list.filter(x=>(x.receiptImages||[]).length);const total=list.reduce((n,x)=>n+(x.receiptImages||[]).length,0);$('#countLabel').textContent=total+' 張';if(!list.length){box.innerHTML='<div class="empty">尚未上傳任何發票</div>';return}list.forEach(x=>box.appendChild(card(x,true)))}else list.forEach(x=>box.appendChild(card(x)))}
function miniIcon(type){const paths={receipt:'<path d="M7 3h10v18l-2-1.5L13 21l-2-1.5L9 21l-2-1.5L5 21V5a2 2 0 0 1 2-2Z"/><path d="M9 8h6M9 12h6M9 16h4"/>',product:'<path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>'};return `<svg viewBox="0 0 24 24">${paths[type]||paths.product}</svg>`}
function card(x,receiptMode=false){const d=document.createElement('div');d.className='item';const gallery=receiptMode?(x.receiptImages||[]):(x.productImages||[]);const img=gallery[0]||'';d.innerHTML=`${img?`<img class="thumb" src="${img}" alt="${receiptMode?'發票':'商品'}照片">`:`<div class="thumb placeholder" style="display:grid;place-items:center">${miniIcon(receiptMode?'receipt':'product')}</div>`}<div><h3>${esc(x.name)} ×${x.qty}</h3><div class="meta">${esc(x.person)}｜${esc(x.store)}</div><div class="meta">${x.status==='done'?money(x.yen):esc(x.note||'尚未購買')}</div>${(x.receiptImages||[]).length?`<div class="meta">${(x.receiptImages||[]).length} 張發票</div>`:''}${gallery.length>1?`<div class="image-count">共 ${gallery.length} 張 · 點照片查看</div>`:''}</div><span class="badge ${x.status}">${x.status==='todo'?'未買':x.status==='found'?'已找到':'已購買'}</span>`;const thumb=d.querySelector('img.thumb');if(thumb){thumb.onclick=e=>{e.stopPropagation();openViewer(gallery,0)}}d.onclick=()=>openForm(x.id);return d}
function renderSettlement(box){$('#listTitle').textContent='依委託人結算';const done=data.filter(x=>x.status==='done');const map={};done.forEach(x=>{const p=x.person||'未指定';map[p]??={sum:0,count:0};map[p].sum+=Number(x.yen||0);map[p].count++});const entries=Object.entries(map).sort((a,b)=>b[1].sum-a[1].sum);$('#countLabel').textContent=entries.length+' 人';if(!entries.length){box.innerHTML='<div class="empty">還沒有已購買的品項</div>';return}const wrap=document.createElement('div');wrap.className='summary';entries.forEach(([p,v])=>{const r=document.createElement('div');r.className='person-row';r.innerHTML=`<div><b>${esc(p)}</b><small>${v.count} 項已購買</small></div><div class="amount"><b>${money(v.sum)}</b><span>實付日幣</span></div>`;wrap.appendChild(r)});box.appendChild(wrap)}
async function storageText(){if(!navigator.storage?.estimate)return '此瀏覽器未提供容量資訊';try{const e=await navigator.storage.estimate();const mb=n=>(n/1024/1024).toFixed(1);return `目前約使用 ${mb(e.usage||0)} MB${e.quota?` / 可用配額 ${mb(e.quota)} MB`:''}` }catch{return '容量資訊暫時無法讀取'}}
function renderBackup(box){$('#listTitle').textContent='備份與還原';$('#countLabel').textContent='';box.innerHTML=`<div class="backup-card"><h3>V5 大容量儲存</h3><p>商品與照片現在儲存在 IndexedDB，不再受舊版 localStorage 的小容量限制。</p><div class="small-note" id="storageInfo">正在估算儲存空間…</div></div><div class="backup-card"><h3>匯出備份</h3><p>把商品、金額、商品照片與發票照片一起存成 JSON 檔。建議旅行中每天備份一次。</p><button class="btn primary" style="width:100%" id="exportBtn">匯出完整備份</button></div><div class="backup-card"><h3>匯入備份</h3><p>可以匯入 V4 或 V5 的 JSON 備份。匯入後會取代目前資料。</p><button class="btn secondary" style="width:100%" id="importBtn">選擇備份檔還原</button></div>`;$('#exportBtn').onclick=exportBackup;$('#importBtn').onclick=()=>$('#importFile').click();storageText().then(t=>{const el=$('#storageInfo');if(el)el.textContent=t})}
let pendingProductImages=[],pendingReceiptImages=[];
function renderFormPreviews(){const box=$('#preview');box.innerHTML='';const addGroup=(title,arr)=>{if(!arr.length)return;const g=document.createElement('div');g.className='preview-group';g.innerHTML=`<div class="preview-title">${title}（${arr.length} 張）</div><div class="preview-grid"></div>`;const grid=g.querySelector('.preview-grid');arr.forEach((src,idx)=>{const w=document.createElement('div');w.className='preview-wrap';const im=new Image();im.src=src;im.alt=title;im.onclick=()=>openViewer(arr,idx);const rm=document.createElement('button');rm.type='button';rm.className='remove-img';rm.textContent='×';rm.onclick=e=>{e.stopPropagation();arr.splice(idx,1);renderFormPreviews()};w.append(im,rm);grid.appendChild(w)});box.appendChild(g)};addGroup('商品參考圖',pendingProductImages);addGroup('發票照片',pendingReceiptImages)}
function openForm(id){$('#modal').style.display='flex';$('#productImages').value='';$('#receiptImages').value='';const editing=!!id;$('#normalActions').classList.toggle('hidden',editing);$('#editActions').classList.toggle('hidden',!editing);if(id){const x=data.find(i=>i.id===id);$('#formTitle').textContent='編輯代購';$('#editId').value=x.id;$('#name').value=x.name;$('#person').value=x.person;$('#store').value=x.store;$('#qty').value=x.qty;$('#status').value=x.status;$('#yen').value=x.yen||'';$('#note').value=x.note||'';pendingProductImages=[...(x.productImages||[])];pendingReceiptImages=[...(x.receiptImages||[])]}else{$('#formTitle').textContent='新增代購';$('#form').reset();$('#editId').value='';$('#qty').value=1;pendingProductImages=[];pendingReceiptImages=[]}renderFormPreviews()}
function closeForm(){$('#modal').style.display='none';pendingProductImages=[];pendingReceiptImages=[]}
async function compressImage(file,max=1280,quality=.72){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height;const scale=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',quality))};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('image load failed'))};img.src=url})}
$('#productImages').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;try{const imgs=await Promise.all(files.map(f=>compressImage(f,1280,.72)));pendingProductImages.push(...imgs);renderFormPreviews()}catch{alert('其中一張商品照片無法讀取，請再試一次。')}finally{e.target.value=''}};
$('#receiptImages').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;try{const imgs=await Promise.all(files.map(f=>compressImage(f,1600,.75)));pendingReceiptImages.push(...imgs);renderFormPreviews()}catch{alert('其中一張發票照片無法讀取，請再試一次。')}finally{e.target.value=''}};
$('#form').onsubmit=async e=>{e.preventDefault();const id=$('#editId').value;let x=id?data.find(i=>i.id===id):{id:crypto.randomUUID(),productImages:[],receiptImages:[]};x.name=$('#name').value.trim();x.person=$('#person').value.trim();x.store=$('#store').value;x.qty=Number($('#qty').value||1);x.status=$('#status').value;x.yen=Number($('#yen').value||0);x.note=$('#note').value.trim();x.updatedAt=Date.now();x.productImages=[...pendingProductImages];x.receiptImages=[...pendingReceiptImages];if(!id)data.unshift(x);try{await save()}catch(err){console.error(err);alert('儲存失敗。請先匯出備份後再試一次。');return}closeForm();render()}
async function deleteCurrent(){const id=$('#editId').value;if(!id)return;if(confirm('確定刪除這筆代購嗎？')){data=data.filter(x=>x.id!==id);await save();closeForm();render()}}
let viewerImages=[],viewerIndex=0,viewerScale=1;
function applyViewer(){const img=$('#viewerImage');img.src=viewerImages[viewerIndex]||'';img.style.width=(viewerScale*100)+'%';$('#viewerCount').textContent=viewerImages.length?`${viewerIndex+1} / ${viewerImages.length}`:'';$('#viewerPrev').disabled=viewerImages.length<2;$('#viewerNext').disabled=viewerImages.length<2;$('#viewerStage').scrollTo(0,0)}
function openViewer(images,index=0){if(!images||!images.length)return;viewerImages=[...images];viewerIndex=Math.max(0,Math.min(index,viewerImages.length-1));viewerScale=1;$('#viewer').classList.add('show');applyViewer()}
function closeViewer(){$('#viewer').classList.remove('show');$('#viewerImage').src='';viewerImages=[]}
$('#viewerClose').onclick=closeViewer;$('#viewerReset').onclick=()=>{viewerScale=1;applyViewer()};$('#viewerZoomIn').onclick=()=>{viewerScale=Math.min(4,viewerScale+.5);applyViewer()};$('#viewerZoomOut').onclick=()=>{viewerScale=Math.max(1,viewerScale-.5);applyViewer()};$('#viewerPrev').onclick=()=>{viewerIndex=(viewerIndex-1+viewerImages.length)%viewerImages.length;viewerScale=1;applyViewer()};$('#viewerNext').onclick=()=>{viewerIndex=(viewerIndex+1)%viewerImages.length;viewerScale=1;applyViewer()};
function exportBackup(){const payload={app:'日本代購',version:5,storage:'IndexedDB',exportedAt:new Date().toISOString(),items:data};const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='日本代購V5備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const parsed=JSON.parse(await f.text());const items=normalize(Array.isArray(parsed)?parsed:parsed.items);if(!Array.isArray(items))throw new Error();if(!confirm(`將以備份中的 ${items.length} 筆資料取代目前資料，確定嗎？`))return;data=items;await save();state.mode='all';render();alert('備份已還原到 V5 大容量儲存。')}catch(err){console.error(err);alert('這不是有效的日本代購備份檔。')}finally{e.target.value=''}};
$('#addBtn').onclick=()=>openForm();$('#cancelBtn').onclick=closeForm;$('#cancelBtn2').onclick=closeForm;$('#deleteBtn').onclick=deleteCurrent;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeForm()};$('#search').oninput=e=>{state.search=e.target.value;render()};$$('#statusFilters .chip').forEach(b=>b.onclick=()=>{$$('#statusFilters .chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.status=b.dataset.status;render()});$$('.menu').forEach(m=>m.onclick=()=>{state.mode=m.dataset.filter;render()});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
initData().catch(err=>{console.error(err);alert('V5 資料庫初始化失敗，請重新整理頁面後再試。')});
</script>
</body></html>
